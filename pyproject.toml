[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextvault-memoryagent"
version = "0.1.0"
description = "Auditable and governed long-term memory for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "duckdb>=1.5,<2",
  "PyYAML>=6.0",
  "mcp>=1.26,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
contextvault = "contextvault.cli:main"
contextvault-mcp = "contextvault.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextvault = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
packages = ["contextvault"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
